<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple Intelligences Avatar Creator</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --text-color: #333;
      --accent-color: #4a90e2;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { margin-bottom: 10px; }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .avatar-box {
      margin: 20px 0;
    }
    img#avatar {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #eee;
    }
    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: bold;
      text-align: left;
    }
    select, input[type="text"], button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="container">
  <h1>Intelligence Avatar Creator</h1>
  
  <div class="avatar-box">
    <img id="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=student" alt="Student Avatar">
  </div>

  <label for="studentName">Your Name:</label>
  <input type="text" id="studentName" placeholder="Enter your name" oninput="updateAvatar()">

  <label for="intelligence">Primary Multiple Intelligence:</label>
  <select id="intelligence" onchange="updateAvatar()">
    <option value="bottts">Linguistic (Word Smart - Bot)</option>
    <option value="shapes">Logical-Mathematical (Number Smart - Geometric)</option>
    <option value="avataaars">Spatial (Picture Smart - Creative)</option>
    <option value="adventurer">Bodily-Kinesthetic (Body Smart - Adventurer)</option>
    <option value="micah">Musical (Music Smart - Artistic)</option>
    <option value="open-peeps">Interpersonal (People Smart - Expressive)</option>
    <option value="persona">Intrapersonal (Self Smart - Reflective)</option>
    <option value="big-ears">Naturalist (Nature Smart - Outdoorsy)</option>
  </select>

  <button onclick="downloadAvatar()">Download Avatar</button>
</div>

<script>
  function updateAvatar() {
    const name = document.getElementById('studentName').value || 'student';
    const style = document.getElementById('intelligence').value;
    const avatarImg = document.getElementById('avatar');
    
    // Generate avatar URL from DiceBear API
    avatarImg.src = `https://api.dicebear.com/7.x/${style}/svg?seed=${encodeURIComponent(name)}`;
  }

  function downloadAvatar() {
    const avatarImg = document.getElementById('avatar');
    const name = document.getElementById('studentName').value || 'avatar';
    
    fetch(avatarImg.src)
      .then(response => response.blob())
      .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${name}-avatar.svg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      });
  }
</script>

</body>
</html>
